# Alerting rules for netauto.
#
# Audits are manual: metrics change when an operator runs one, and sit still
# in between. That rules out anything phrased as "in the last hour" -- between
# audits every series is a flat line, so a rule comparing recent values to
# slightly less recent ones would never fire. These compare against last week,
# or watch for states that are wrong however long they have been true.

groups:
  - name: netauto
    rules:
      - alert: NetautoCollectorError
        # The exporter could not read its own inventory or config. Distinct
        # from having nothing to report, which is the normal state before the
        # first audit and must not page anyone.
        expr: netauto_collector_error == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Netauto cannot read its inventory
          description: >-
            {{ $labels.error }}. Check `journalctl --user -u netauto-web`.

      - alert: NetautoDeviceUnreachable
        # Static between audits, so this says "the last audit could not reach
        # it", not "it has been down for 45 minutes".
        expr: netauto_device_up == 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: "Last audit of {{ $labels.device }} could not reach it"
          description: >-
            netauto could not connect to or authenticate against
            {{ $labels.device }} ({{ $labels.platform }}) on its most recent
            audit. The device itself may be fine. Re-run the audit to clear.

      - alert: NetautoDeviceNeverAudited
        # A device in the inventory that no audit has ever covered reports a
        # zero timestamp, which would otherwise look like 1970 on a dashboard.
        expr: netauto_device_last_audit_timestamp_seconds == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} has never been audited"

      - alert: NetautoAuditStale
        # Thirty days. Audits are operator-driven, so "stale" is a question of
        # policy rather than of the system misbehaving -- this is a nudge, not
        # a fault.
        expr: >-
          netauto_device_last_audit_timestamp_seconds > 0
          and time() - netauto_device_last_audit_timestamp_seconds > 2592000
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.device }} has not been audited in a month"

      - alert: NetautoCriticalFindingAppeared
        # Against last week, not last hour: with manual audits an hour ago is
        # usually the same audit, so the comparison would always be zero.
        expr: >-
          sum by (device) (netauto_findings_failed{severity="critical"})
          > sum by (device) (netauto_findings_failed{severity="critical"} offset 7d)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "New critical compliance finding on {{ $labels.device }}"
          description: >-
            Critical findings on {{ $labels.device }} rose against a week ago.
            See the Netauto Compliance dashboard for the rule.
