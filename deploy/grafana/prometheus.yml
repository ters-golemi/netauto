# Prometheus scrape config for netauto.
#
# The scrape interval is short because scraping is free: it reads a cached
# snapshot and touches no device. How often devices are actually audited is set
# by NETAUTO_METRICS_INTERVAL on the netauto service, not here.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: netauto
    # Reachable because this container runs on the host network; netauto binds
    # 127.0.0.1 and is not exposed to the network.
    static_configs:
      - targets: ["127.0.0.1:8080"]
    metrics_path: /metrics
    authorization:
      type: Bearer
      # Generated by setup; gitignored. Must match NETAUTO_METRICS_TOKEN in
      # ~/.config/netauto/netauto.env.
      credentials_file: /etc/prometheus/scrape-token

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
