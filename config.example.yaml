# Copy to config.yaml. Holds no secrets -- those live in the environment.

inventory_path: inventory/devices.yaml

# The safety switch. netauto has one device write -- firmware upgrade (the
# Software Upgrade workflow) -- and it is off unless this is true. Even then it
# needs the driver's upgrade capability and per-device confirmation, and it does
# NOT enable any configuration commit: there is no such path. Leave false unless
# you are deliberately running an upgrade armed.
allow_writes: false

connect_timeout: 30
command_timeout: 60
max_concurrency: 8

# Where the Lab page looks for netlab topologies to build. A topology is a
# directory holding a topology.yml, or a bare *.yml file, under here. Optional;
# defaults to labs/. netlab itself is optional -- the Lab page explains how to
# install it where it is absent. See docs/netlab-integration.md.
labs_dir: labs
