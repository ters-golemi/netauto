! FortiSwitch configuration template — FortiSwitch 108F, standalone mode
!
! Access switch for the NetAuto lab. One switch carries both user traffic and
! management; there is no dedicated management VLAN. The switch is reached
! in-band on VLAN 10.
!
! Applied to a FortiSwitch 108F on FortiSwitchOS 7.2.7 (build 0479). The
! version-specific corrections found there are folded in below, each marked
! "7.2.7:". Still verify against your own build -- these are the lines that move
! between releases. Run `get system status` for the version, configure port1
! only, then `show switch interface port1` to confirm the shape before the rest.
! The trunk took `allowed-vlans` alone; no `untagged-vlans` was needed on 7.2.7.
!
! netauto cannot apply this. It has no commit path by design.
! Companion document: docs/lab-data-plane.md

! --- identity and mode ------------------------------------------------------
! Confirm standalone first. A unit ever paired to a FortiGate is in FortiLink
! mode and ignores local configuration.

config system global
    set hostname fsw-access-01
    set switch-mgmt-mode local
end

! --- VLANs ------------------------------------------------------------------

config switch vlan
    edit 10
        set description "Users and management"
    next
    edit 20
        set description "Servers"
    next
    edit 30
        set description "WiFi"
    next
end

! --- management interface ---------------------------------------------------
! In-band on VLAN 10. Changing this from the console is mandatory: applying it
! over SSH drops the session that is applying it.

! 7.2.7: the interface is DHCP by default, so `set mode static` must precede
! `set ip` or it is rejected with "Can't change dynamic IP". And `internal` is
! type physical, so it takes no `set vlanid` -- the VLAN binding is done with
! `set native-vlan` under `config switch interface`, immediately below.
config system interface
    edit "internal"
        set mode static
        set ip 10.10.10.12 255.255.255.0
        set allowaccess ping https ssh snmp
    next
end

! 7.2.7: this is the binding `set vlanid` could not do above. native-vlan 10
! puts management on VLAN 10 untagged; allowed-vlans lets the tagged VLANs reach
! the CPU over the trunk.
config switch interface
    edit "internal"
        set native-vlan 10
        set allowed-vlans 10,20,30
    next
end

! Default route via the FTD VLAN10 interface. Needed for the switch to answer
! anything off VLAN 10, and to reach syslog or NTP if either ever moves.

config router static
    edit 1
        set device "internal"
        set gateway 10.10.10.1
    next
end

! --- ports ------------------------------------------------------------------
! port1  trunk   -> FTD Ethernet1/8, tagged 10/20/30, native 1 carries nothing
! port2  down    -> freed when the FTD Mgmt1/1 cable was removed
! port3  access  -> NetAuto host / admin PC, VLAN 10
! port4  trunk   -> access point, mgmt untagged VLAN 10, SSID tagged VLAN 30
! port5  access  -> wired user, VLAN 10
! port6  access  -> server, VLAN 20
! port7  down
! port8  down

config switch interface
    edit "port1"
        set description "Trunk to FTD Ethernet1/8"
        set native-vlan 1
        set allowed-vlans 10,20,30
        set stp-state enabled
        set edge-port disabled
    next
    edit "port3"
        set description "NetAuto host / admin PC"
        set native-vlan 10
        set stp-state enabled
        set edge-port enabled
        set stp-bpdu-guard enabled
    next
    edit "port4"
        set description "Access point"
        set native-vlan 10
        set allowed-vlans 30
        set stp-state enabled
        set edge-port disabled
    next
    edit "port5"
        set description "Wired user"
        set native-vlan 10
        set stp-state enabled
        set edge-port enabled
        set stp-bpdu-guard enabled
    next
    edit "port6"
        set description "Server"
        set native-vlan 20
        set stp-state enabled
        set edge-port enabled
        set stp-bpdu-guard enabled
    next
end

config switch physical-port
    edit "port2"
        set status down
    next
    edit "port7"
        set status down
    next
    edit "port8"
        set status down
    next
end

! --- administrative access --------------------------------------------------
! A /32, not the VLAN 10 subnet. Management shares the users VLAN now, so a /24
! trusted host would make every user machine an administrative source. This is
! the single line that keeps the in-band design from being materially weaker
! than the out-of-band one it replaced.

config system admin
    edit admin
        set password <password>
        set trusthost1 10.10.10.20 255.255.255.255
    next
end

! --- logging ----------------------------------------------------------------
! netauto's vendor ruleset checks FortiOS trusted hosts and remote logging, so
! configuring both means the first audit run says something about the toolkit
! rather than re-reporting a bare lab config.

config log syslogd setting
    set status enable
    set server 10.10.10.20
    set port 514
end

! --- time source ------------------------------------------------------------
! The twin of the logging block: netauto's ruleset also checks for a configured
! NTP source, and without one a fresh build from this template audits with one
! finding left (NA-101). The servers below are Google public NTP; any reachable
! server works, and they only sync once the switch has a route off VLAN 10.
!
! 7.2.7: `set type custom` under `config system ntp` is a parse error on this
! build -- omit it. A `config ntpserver` block with servers is enough, and
! `show system ntp` reads the config back to confirm.

config system ntp
    set ntpsync enable
    config ntpserver
        edit 1
            set server "216.239.35.0"
        next
        edit 2
            set server "216.239.35.4"
        next
    end
end
